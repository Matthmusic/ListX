name: Build and Release

on:
  push:
    tags:
      - 'v*' # Déclenché sur les tags qui commencent par 'v' (ex: v1.0.0)

jobs:
  release:
    runs-on: windows-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Cache Electron downloads
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
            ~\AppData\Local\electron-builder\Cache\nsis
          key: ${{ runner.os }}-electron-${{ hashFiles('package-lock.json') }}

      - name: Install dependencies
        run: npm ci
        env:
          npm_config_fund: false
          npm_config_audit: false

      - name: Build application
        run: npm run electron:build
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          ELECTRON_CACHE: ${{ env.USERPROFILE }}\AppData\Local\electron\Cache
          ELECTRON_BUILDER_CACHE: ${{ env.USERPROFILE }}\AppData\Local\electron-builder\Cache

      - name: Upload release assets
        uses: softprops/action-gh-release@v1
        with:
          files: |
            release/*.exe
            release/*.yml
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
